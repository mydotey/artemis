# SQLite DataSource Configuration for Artemis
# This file can be used instead of data-source.properties to use SQLite instead of MySQL

driverClassName=org.sqlite.JDBC
url=jdbc:sqlite:./artemis.db
username=
password=

# Connection pool settings
initialSize=5
maxActive=20
maxIdle=10
minIdle=2
maxWait=30000

# SQLite specific settings
# Enable WAL mode for better concurrency (SQLite 3.7.0+)
# These are set via JDBC URL parameters in the init script
